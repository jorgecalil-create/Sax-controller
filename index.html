<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sax Notes (Log + Durations)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    #topbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    button { font-size: 16px; padding: 10px 14px; }
    #status { opacity: 0.8; }
    #currentWrap { margin: 16px 0; }
    #current { font-size: 64px; line-height: 1; }
    #currentSmall { opacity: 0.75; margin-top: 6px; }

    /* Scrollable log */
    #log {
      height: 70vh;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px;
      overflow-y: auto;
      font-size: 20px;
      background: #fff;
    }
    .row {
      display: grid;
      grid-template-columns: 90px 120px 1fr;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px dashed #eee;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
    }
    .note { font-size: 26px; }
    .dur { opacity: 0.85; }
    .ts  { opacity: 0.6; font-size: 14px; }
    .live { background: #f6f8ff; } /* highlight current/open note */
  </style>
</head>

<body>
  <div id="topbar">
    <button id="connect">Connect to Sax</button>
    <button id="clear">Clear Log</button>
    <span id="status">Not connected</span>
  </div>

  <div id="currentWrap">
    <div id="current">--</div>
    <div id="currentSmall">Duration updates when you change notes.</div>
  </div>

  <div id="log" title="Scroll up to pause auto-follow. Scroll back to bottom to resume."></div>

<script>
  const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
  const NOTE_UUID    = "19b10001-e8f2-537e-4f6c-d104768a1214";

  const statusEl = document.getElementById("status");
  const currentEl = document.getElementById("current");
  const logEl = document.getElementById("log");

  let autoFollow = true;

  // Current "open" note segment (we close it when next note arrives)
  let currentSegment = null; // {note, startMs, rowEl, durEl, tsEl}

  function fmtSeconds(ms) {
    // Thousandths of a second (0.000)
    return (ms / 1000).toFixed(3) + "s";
  }

  function fmtTime(msEpoch) {
    const d = new Date(msEpoch);
    return d.toLocaleTimeString(undefined, { hour12: false }) + "." +
           String(d.getMilliseconds()).padStart(3, "0");
  }

  function atBottom() {
    // close enough to bottom
    return (logEl.scrollTop + logEl.clientHeight) >= (logEl.scrollHeight - 10);
  }

  logEl.addEventListener("scroll", () => {
    autoFollow = atBottom();
  });

  function scrollToBottomIfAllowed() {
    if (autoFollow) {
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  function addNewSegment(note) {
    const now = performance.now();
    const nowEpoch = Date.now();

    // Close previous segment
    if (currentSegment) {
      const durMs = now - currentSegment.startMs;
      currentSegment.durEl.textContent = fmtSeconds(durMs);
      currentSegment.rowEl.classList.remove("live");
    }

    // Create new row at the BOTTOM (so scrolling back shows history)
    const row = document.createElement("div");
    row.className = "row live";

    const noteEl = document.createElement("div");
    noteEl.className = "note";
    noteEl.textContent = note.trim() || note;

    const durEl = document.createElement("div");
    durEl.className = "dur";
    durEl.textContent = "…"; // unknown until closed

    const tsEl = document.createElement("div");
    tsEl.className = "ts";
    tsEl.textContent = fmtTime(nowEpoch);

    row.appendChild(noteEl);
    row.appendChild(durEl);
    row.appendChild(tsEl);

    logEl.appendChild(row);

    // Update current display
    currentEl.textContent = note.trim() || note;

    currentSegment = { note, startMs: now, rowEl: row, durEl, tsEl };

    scrollToBottomIfAllowed();
  }

  function clearLog() {
    logEl.innerHTML = "";
    currentEl.textContent = "--";
    currentSegment = null;
    autoFollow = true;
  }

  document.getElementById("clear").addEventListener("click", clearLog);

  async function connect() {
    statusEl.textContent = "Requesting device...";
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "SaxNote" }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener("gattserverdisconnected", () => {
      statusEl.textContent = "Disconnected";
    });

    statusEl.textContent = "Connecting...";
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    const ch = await service.getCharacteristic(NOTE_UUID);

    // Read initial value (optional)
    try {
      const v0 = await ch.readValue();
      const note0 = String.fromCharCode(v0.getUint8(0), v0.getUint8(1));
      addNewSegment(note0);
    } catch (e) {}

    await ch.startNotifications();
    ch.addEventListener("characteristicvaluechanged", (e) => {
      const v = e.target.value;
      const note = String.fromCharCode(v.getUint8(0), v.getUint8(1));
      addNewSegment(note);
    });

    statusEl.textContent = "Connected ✅";
  }

  document.getElementById("connect").addEventListener("click", () => {
    connect().catch(err => {
      console.error(err);
      statusEl.textContent = "Error: " + err.message;
    });
  });
</script>
</body>
</html>
